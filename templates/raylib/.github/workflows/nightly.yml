name: Nightly Build & Release

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 3 * * *' # Every night at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Native App & Nightly Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix with Flakes
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run Headless Tests & Smoke Verifications
        run: |
          nix develop --command make -C editor test

      - name: Build Linux Standalone Package
        run: |
          nix develop --command make -C editor package-linux
          tar -czf build/cubeforge-raylib-linux-x64.tar.gz -C build cubeforge-raylib-linux

      - name: Cross-Compile Windows x64 Package
        run: |
          nix develop --command make -C editor package
          cd build && zip -r cubeforge-raylib-win64.zip cubeforge-raylib-win64 && cd ..

      - name: Bump Nightly Tag to Current Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f nightly ${{ github.sha }}
          git push -f origin nightly

      - name: Create or Update Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          name: "cubeforge - Nightly Build"
          body: |
            Automated nightly build of **cubeforge** (Raylib 6.0 + Dear ImGui + Lua).
            
            ### Included Packages:
            - `cubeforge-raylib-win64.zip`: Standalone portable Windows x64 release (includes runtime DLLs, vector fonts, and Lua runtime).
            - `cubeforge-raylib-linux-x64.tar.gz`: Standalone Linux x86_64 package.
            
            *Built automatically from commit ${{ github.sha }} on $(date -u +'%Y-%m-%d %H:%M UTC').*
          prerelease: true
          make_latest: true
          files: |
            build/cubeforge-raylib-win64.zip
            build/cubeforge-raylib-linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
